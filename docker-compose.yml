# docker compose up -d   (see HOSTING.md)
services:
  bot:
    build: .
    restart: unless-stopped
    env_file: .env
    volumes:
      - botdata:/data
    ports:
      # the dashboard only on the server itself; open it from your PC through an SSH tunnel
      - "127.0.0.1:8765:8765"

volumes:
  botdata:
